<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ViewStack Documentation</title>
    <meta name="description" content="Documentation for ViewStack — an open-source React dashboard for Indian development data" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />
    <style>
      :root {
        --theme-color: #1a56db;
        --sidebar-nav-link-color--active: #1a56db;
        --sidebar-name-font-size: 1.5rem;
        --sidebar-name-font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'ViewStack',
        repo: 'Varnasr/ViewStack',
        loadSidebar: true,
        subMaxLevel: 3,
        search: 'auto',
        auto2top: true,
        coverpage: true,
        themeColor: '#1a56db',
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  </body>
</html>
